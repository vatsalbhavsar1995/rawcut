 for(let i=0;i<=NC;i++){const a=q.a-.62+i*1.24/NC;let r=0;while(r<24){if(solid(q.fl,q.x+Math.cos(a)*(r+.8),q.z+Math.sin(a)*(r+.8)))break;r+=.8}pos.setXYZ(i+1,q.x+Math.cos(a)*r,y,q.z+Math.sin(a)*r)}pos.needsUpdate=true}

function render(now){
 const sp=Math.hypot(vel.x,vel.z)/PSPD;
 if(st==='title'){cam.position.set(30,24,64);cam.lookAt(30,3,20)}
 else{
  pl.position.set(P.x,P.y,P.z);{const mvg=Math.hypot(vel.x,vel.z)>.6,t0=aimT>0?yaw+Math.PI:(mvg?Math.atan2(vel.x,vel.z):bodyY);bodyY+=ad(t0,bodyY)*(1-Math.exp(-14*dtR));pl.rotation.y=bodyY}
  const sw=Math.sin(now/110)*.9*ts;pp.lL.rotation.x=sw;pp.lR.rotation.x=-sw;pp.aL.rotation.x=aimT>0?-1.2:-.2;pp.aR.rotation.x=aimT>0?-1.45:-.3;pp.wt.material.color.setHSL((45-45*s)/360,.75,.5);pp.wt.material.emissive.setHSL((45-45*s)/360,.75,.35);
  pl.visible=inv<=0||Math.floor(now/80)%2===0;
  for(const q of en){q.m.position.set(q.x,q.fl*FH,q.z);q.m.rotation.y=Math.PI/2-q.a;
   if(q.dead){q.c.visible=false;q.m.rotation.x+=(-1.45-q.m.rotation.x)*.12;q.m.position.y=q.fl*FH+.3;continue}
   const w=q.mv?Math.sin(now/130+q.x)*.8*ts:0;q.pr.lL.rotation.x=w;q.pr.lR.rotation.x=-w;q.pr.aL.rotation.x=q.al?-1.2:-w*.8;q.pr.aR.rotation.x=q.al?-1.45:w*.8;
   q.c.visible=q.fl===P.fl;if(q.c.visible){updCone(q);q.c.material.color.setHex(q.al?0xff7a2a:0xb8362f)}}
  const hd=P.y+2.4,sx=Math.sin(yaw),sz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let D=5;for(let t=.6;t<=5;t+=.4){if(solid(P.fl,P.x+sx*t,P.z+sz*t)){D=Math.max(1.4,t-.8);break}}
  let sh=1,cx=P.x+sx*Math.cos(pit)*D+rx*sh,cz=P.z+sz*Math.cos(pit)*D+rz*sh;
  if(solid(P.fl,cx,cz)){sh=0;cx=P.x+sx*Math.cos(pit)*D;cz=P.z+sz*Math.cos(pit)*D}
  let cy=hd+Math.sin(pit)*D;if(P.fl===0)cy=Math.min(cy,5.2);
  const sk=shake*.35;tmp.set(cx+(Math.random()-.5)*sk,cy+(Math.random()-.5)*sk,cz+(Math.random()-.5)*sk);
  cam.position.lerp(tmp,1-Math.exp(-18*dtR));
  cam.lookAt(P.x-sx*5+rx*sh*.6,hd-.1,P.z-sz*5+rz*sh*.6);
  const kz=killT>0?Math.min(1,killT/.75):0,tf=62+8*sp-14*kz;fov+=(tf-fov)*(1-Math.exp(-8*dtR));if(Math.abs(cam.fov-fov)>.05){cam.fov=fov;cam.updateProjectionMatrix()}
  const tg=obj===0?[DESK[0],DESK[1],1]:obj===1?[CR[0],CR[1],0]:[EX[0],EX[1],0];bc.position.set(tg[0],tg[2]*FH+6,tg[1]);bc.material.opacity=.15+.12*Math.sin(now/300);
 }
 crate.rotation.y=now/900;
 R.render(sc,cam);
 const f=`saturate(${(.25+.75*ts).toFixed(2)}) contrast(${(1.12-.12*ts+(killT>0?.12:0)).toFixed(2)})`;if(cv.style.filter!==f)cv.style.filter=f;
 hud(now)}

function hud(now){
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
 if(st==='title')return;
 g.font='12px "Courier New",monospace';g.textBaseline='top';
 let y=12;g.fillStyle='rgba(216,210,192,.9)';g.fillText(P.fl?'TOP FLOOR':'GROUND FLOOR',14,y);y+=20;
 OBJ.forEach((o,i)=>{if(i>obj)return;const dn=i<obj,t=(dn?'☑ ':'☐ ')+o;g.fillStyle=dn?'rgba(216,210,192,.4)':'#d8d2c0';g.fillText(t,14,y);if(dn)g.fillRect(14,y+6,g.measureText(t).width,1);y+=17});
 const tg=obj===0?[DESK[0],DESK[1],1]:obj===1?[CR[0],CR[1],0]:[EX[0],EX[1],0];
 g.fillStyle='#c9a24a';g.fillText('▸ '+Math.round(Math.hypot(P.x-tg[0],P.z-tg[1]))+' m'+(tg[2]!==P.fl?(tg[2]?'  — go UP':'  — go DOWN'):''),14,y+2);
 // vignettes
 if(alarm){g.fillStyle='rgba(184,54,47,'+(.06+.04*Math.sin(now/200))+')';g.fillRect(0,0,W,H)}
 if(hitF>0){g.fillStyle='rgba(200,30,30,'+(hitF*.35)+')';g.fillRect(0,0,W,H)}
 if(killT>0){g.fillStyle='rgba(255,255,255,'+(Math.min(1,killT/.75)*.1)+')';g.fillRect(0,0,W,H)}
 // crosshair
 g.strokeStyle=alarm?'#ff5a4a':'rgba(216,210,192,.9)';g.lineWidth=1.5;{const cx=W/2,cy=H/2;g.beginPath();g.moveTo(cx-11,cy);g.lineTo(cx-4,cy);g.moveTo(cx+4,cy);g.lineTo(cx+11,cy);g.moveTo(cx,cy-11);g.lineTo(cx,cy-4);g.moveTo(cx,cy+4);g.lineTo(cx,cy+11);g.stroke()}
 // hp + ammo
 for(let i=0;i<3;i++){g.fillStyle=i<hp?'#b8362f':'#2a2f35';g.beginPath();g.arc(20+i*20,H-96,7,0,6.2832);g.fill()}
 g.fillStyle='#d8d2c0';g.fillText(reload>0?'RELOADING…':'ROUNDS '+mag+'/8',14,H-80);g.fillText('HOSTILES '+en.filter(q=>!q.dead).length,14,H-64);
 if(toastT>0){g.textAlign='center';g.globalAlpha=Math.min(1,toastT);toast.split('\n').forEach((l,i)=>{g.fillStyle='#c9a24a';g.fillText(l,W/2,H*.2+i*17)});g.globalAlpha=1;g.textAlign='left'}
 // minimap (current floor)
 const ms=2.5,mw=60*ms,mh=40*ms,mx0=W-mw-12,my0=H-mh-12;
 g.fillStyle='rgba(8,12,16,.8)';g.fillRect(mx0-4,my0-4,mw+8,mh+8);g.strokeStyle='#3a4148';g.lineWidth=1;g.strokeRect(mx0-4,my0-4,mw+8,mh+8);
 g.fillStyle='#3a4651';for(const w of F[P.fl])g.fillRect(mx0+w.x*ms,my0+w.z*ms,Math.max(1,w.w*ms),Math.max(1,w.d*ms));
 if(P.fl){g.fillStyle='rgba(120,140,160,.5)';for(const w of RL)g.fillRect(mx0+w.x*ms,my0+w.z*ms,Math.max(1,w.w*ms),Math.max(1,w.d*ms))}
 g.fillStyle='#b8362f';for(const q of en)if(!q.dead&&q.fl===P.fl){g.beginPath();g.arc(mx0+q.x*ms,my0+q.z*ms,2.5,0,6.2832);g.fill()}
 if(tg[2]===P.fl){g.strokeStyle=`rgba(201,162,74,${.5+.4*Math.sin(now/300)})`;g.lineWidth=1.5;g.beginPath();g.arc(mx0+tg[0]*ms,my0+tg[1]*ms,6,0,6.2832);g.stroke()}
 g.fillStyle='#d8d2c0';g.beginPath();g.arc(mx0+P.x*ms,my0+P.z*ms,3,0,6.2832);g.fill();
 g.strokeStyle='#d8d2c0';g.beginPath();g.moveTo(mx0+P.x*ms,my0+P.z*ms);g.lineTo(mx0+P.x*ms-Math.sin(yaw)*9,my0+P.z*ms-Math.cos(yaw)*9);g.stroke();
 // cover watch
 const r=30,wx=52,wy=H-34-r-110;g.save();g.translate(wx,wy);
 g.fillStyle='#0c0f12';g.beginPath();g.arc(0,0,r+4,0,6.2832);g.fill();g.strokeStyle='#3a4148';g.lineWidth=2;g.stroke();
 g.strokeStyle='#1d2328';g.lineWidth=6;g.beginPath();g.arc(0,0,r-6,0,6.2832);g.stroke();
 g.strokeStyle=`hsl(${45-45*s},70%,52%)`;g.beginPath();g.arc(0,0,r-6,-1.5708,-1.5708+s*6.2832);g.stroke();
 const ha=-1.5708+s*6.2832;g.strokeStyle='#d8d2c0';g.lineWidth=2;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(ha)*(r-10),Math.sin(ha)*(r-10));g.stroke();
 if(s>.75){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1;g.beginPath();g.moveTo(-8,-r);g.lineTo(-2,-8);g.lineTo(-12,4);g.lineTo(-6,r);g.moveTo(-2,-8);g.lineTo(12,-14);g.stroke()}
 g.restore()}

function showOld(k){
 if(k==='title')ov.innerHTML='<p class="stamp">Day 1 — 120 hours remaining</p><h1 class="big">THE IMPOUND</h1><p class="dim">Two floors. Eleven hostiles. Plant the dossier upstairs, take the shipment from the vault downstairs, and leave through the loading bay.</p><p class="dim">Time moves only when you move or look. Stand still to aim, move to dodge.</p><p class="dim"><b>Touch:</b> left thumb moves, right thumb aims, FIRE shoots.<br><b>Mouse:</b> click once to capture it, or just move the cursor left or right of centre to turn. Click fires. WASD moves, Q/E turns, R reloads.</p><p>Tap to begin</p>';
 if(k==='dead')ov.innerHTML='<p class="stamp">Shot down</p><p class="dim">Bullets crawl when you stand still and fly when you run. Aim in the freeze, then break line of sight behind cover.</p><p>Tap to retry</p>';
 if(k==='win')ov.innerHTML='<p class="q">Manifest, line 14:<br>“SRV-C. Maintenance contract, downtown.”</p><p class="stamp">Impound — closed</p><p class="dim">Hostiles down: '+kills+' of 11. Hits taken: '+hits+'. Time: '+Math.round(tsec)+' s.</p><p>Tap to replay</p>';
 ov.className='';try{document.exitPointerLock()}catch(_){}}
function start(){init();st='play';ov.className='h';keys={};joy=null;jo=null;lk=null;md=null}
function sv(){try{localStorage.setItem('rc',JSON.stringify({cm,sens,invY,lowq}))}catch(_){}}
try{const j=JSON.parse(localStorage.getItem('rc')||'{}');if(j.cm)cm=j.cm;if(j.sens)sens=j.sens;invY=!!j.invY;lowq=!!j.lowq}catch(_){}
function applyQ(){sc.traverse(o=>{if(o.isPointLight)o.visible=!lowq});sc.children[0].intensity=lowq?1.15:.75;rs()}
function pause(){if(st!=='play')return;st='pause';keys={};joy=null;jo=null;lk=null;md=null;show('pause')}
function resume(){if(st!=='pause')return;st='play';ov.className='h'}
function act(a){
 if(a==='play'||a==='restart')start();
 else if(a==='resume')resume();
 else if(a==='menu'){st='title';show('title')}
 else if(a==='set')show('set');
 else if(a==='back')show(st==='pause'?'pause':'title');
 else{if(a==='cm')cm=cm==='auto'?'drag':cm==='drag'?'steer':'auto';if(a==='sm')sens=Math.max(.5,sens-.25);if(a==='sp')sens=Math.min(2.5,sens+.25);if(a==='iy')invY=!invY;if(a==='q'){lowq=!lowq;applyQ()}sv();show('set')}}
function show(k){
 const bt=(a,t)=>'<button class="bt" data-a="'+a+'">'+t+'</button>',sm='style="display:inline-block;min-width:54px"';
 if(k==='title')ov.innerHTML='<p class="stamp">Day 1 — 120 hours remaining</p><h1 class="big">THE IMPOUND</h1><p class="dim">Two floors, eleven hostiles. Plant the dossier upstairs, take the shipment from the vault downstairs, leave through the loading bay.</p><p class="dim">Time moves only when you move or look. Stand still to aim, move to dodge.</p>'+bt('play','PLAY')+bt('set','SETTINGS')+'<p class="dim">WASD move · drag the mouse to look (or click to capture it) · click fires · R reload · Esc or P pause<br>Touch: left thumb moves, right thumb aims, FIRE shoots.</p>';
 else if(k==='pause')ov.innerHTML='<h1 class="big">PAUSED</h1>'+bt('resume','RESUME')+bt('restart','RESTART')+bt('set','SETTINGS')+bt('menu','MAIN MENU');
 else if(k==='set')ov.innerHTML='<h1 class="big">SETTINGS</h1>'+bt('cm','LOOK: '+({auto:'AUTO (capture, else drag)',drag:'DRAG TO LOOK',steer:'CURSOR STEER'}[cm]))+'<p>SENSITIVITY <button class="bt" '+sm+' data-a="sm">−</button> '+sens.toFixed(2)+' <button class="bt" '+sm+' data-a="sp">+</button></p>'+bt('iy','INVERT Y: '+(invY?'ON':'OFF'))+bt('q','GRAPHICS: '+(lowq?'LOW (faster)':'HIGH'))+bt('back','BACK');
 else{showOld(k);ov.innerHTML+=bt('menu','MAIN MENU');return}
 ov.className='';try{document.exitPointerLock()}catch(_){}}
const pb=document.getElementById('pb');pb.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();pause()});
addEventListener('contextmenu',e=>e.preventDefault());
applyQ();

/* ---------- input ---------- */
ov.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const a=e.target.dataset&&e.target.dataset.a;if(a){act(a);return}if(st==='dead'||st==='win')start()});
fb.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();fire()});
document.addEventListener('pointerlockchange',()=>{const was=lockOK;lockOK=document.pointerLockElement===cv;if(was&&!lockOK&&st==='play')pause()});
document.addEventListener('pointerlockerror',()=>{lockOK=false});
wrap.addEventListener('pointerdown',e=>{if(st!=='play'||e.target===ov||e.target===fb)return;
 if(e.pointerType==='touch'){if(e.clientX<W/2){if(!jo){jo={x:e.clientX,y:e.clientY,id:e.pointerId};joy={x:0,y:0}}}else if(!lk)lk={x:e.clientX,y:e.clientY,id:e.pointerId}}
 else{mseen=true;mx=e.clientX;if(lockOK){if(e.button===0)fire()}else if(cm!=='steer'){md={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};if(cm==='auto'){try{cv.requestPointerLock()}catch(_){}}}else if(e.button===0)fire()}});
addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse'){mx=e.clientX;mseen=true;if(lockOK&&st==='play'){tYaw+=Math.max(-40,Math.min(40,e.movementX))*.0013*sens;tPit=Math.max(.05,Math.min(.7,tPit+Math.max(-40,Math.min(40,e.movementY))*.001*sens*(invY?-1:1)));return}if(md&&st==='play'&&e.pointerId===md.id){const dx=e.clientX-md.x,dy=e.clientY-md.y;if(md.moved||Math.hypot(dx,dy)>6){md.moved=true;tYaw+=dx*.0045*sens;tPit=Math.max(.05,Math.min(.7,tPit+dy*.003*sens*(invY?-1:1)));md.x=e.clientX;md.y=e.clientY}return}}
 if(jo&&e.pointerId===jo.id){const dx=(e.clientX-jo.x)/40,dy=(e.clientY-jo.y)/40,m=Math.hypot(dx,dy);joy=m>1?{x:dx/m,y:dy/m}:{x:dx,y:dy}}
 else if(lk&&e.pointerId===lk.id){tYaw+=(e.clientX-lk.x)*.0045;tPit=Math.max(.05,Math.min(.7,tPit+(e.clientY-lk.y)*.003));lk.x=e.clientX;lk.y=e.clientY}});
const up=e=>{if(jo&&e.pointerId===jo.id){jo=null;joy=null}if(lk&&e.pointerId===lk.id)lk=null;if(md&&e.pointerId===md.id){if(!md.moved&&e.type==='pointerup'&&e.button===0&&!lockOK&&st==='play')fire();md=null}};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(e.key==='Escape'||k==='p'){if(st==='play')pause();else if(st==='pause')resume();return}
 if((st==='title'||st==='dead'||st==='win')&&(e.key==='Enter'||e.key===' ')){start();return}
 if(k===' '||k==='f'){fire();e.preventDefault()}if(k==='r'&&mag<8&&reload<=0)reload=1.4});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
function rs(){dpr=lowq?1:Math.min(devicePixelRatio||1,2);W=wrap.clientWidth;H=wrap.clientHeight;R.setPixelRatio(dpr);R.setSize(W,H,false);hc.width=W*dpr;hc.height=H*dpr;cam.aspect=W/H;cam.updateProjectionMatrix()}
addEventListener('resize',rs);
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;dtR=dt;if(st==='play')step(dt);render(now);requestAnimationFrame(frame)}
rs();init();show('title');requestAnimationFrame(frame);
</script></body></html>
